# Server Configuration - Dynamic PORT for Render / Cloud deployment (falls back to 8080 locally)
server.port=${PORT:8080}

# Spring Application Name
spring.application.name=kk-jewellers-backend

# MongoDB Database Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/kkjewellers}

# Cloudinary Storage Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo_cloud}
cloudinary.api-key=${CLOUDINARY_API_KEY:demo_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:demo_secret}

# JWT Security Secrets
jwt.secret=${JWT_SECRET:edrzvzOG9yAnYVAkcYrFPYpm7hZoqChf5uqk8Ta6ZwRYspnpA8LO3VBGHRR9W9Zh09c+APoVsso/VXXUml6Y2g==}
jwt.expiration=86400000

# File upload limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
